<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil Desa | Website Resmi Desa Bulurejo</title>

<meta name="description"
content="Profil Desa Bulurejo Kecamatan Mantewe Kabupaten Tanah Bumbu">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

:root{

--primary:#2E7D32;
--primary2:#43A047;
--secondary:#E8F5E9;
--white:#FFFFFF;
--dark:#263238;
--text:#616161;
--border:#E5E7EB;
--shadow:0 10px 30px rgba(0,0,0,.08);

}

body{
background:#F5F7FA;
color:var(--dark);
overflow-x:hidden;
}

/* ===================================
HEADER
=================================== */

.header{
position:fixed;
top:0;
left:0;
width:100%;
height:80px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 35px;
background:rgba(255,255,255,.96);
backdrop-filter:blur(12px);
box-shadow:0 4px 18px rgba(0,0,0,.08);
z-index:9999;
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo img{
width:58px;
height:58px;
object-fit:contain;
transition:.35s;
}

.logo img:hover{
transform:scale(1.08);
}

.logo-text h2{
font-size:24px;
font-weight:700;
color:var(--primary);
}

.logo-text p{

font-size:13px;
color:#666;

}

/* ===================================
MENU DESKTOP
=================================== */

.nav-menu{

display:flex;
align-items:center;
gap:28px;

}

.nav-menu a{

text-decoration:none;
font-size:15px;
font-weight:600;
color:var(--dark);
transition:.3s;

}

.nav-menu a:hover{

color:var(--primary);

}

/* ===================================
MENU MOBILE
=================================== */

.menu-toggle{
display:none;
font-size:28px;
cursor:pointer;
color:var(--primary);
}

.mobile-menu{
position:fixed;
top:80px;
right:-100%;
width:300px;
height:calc(100vh - 80px);
background:#fff;
padding:25px;
overflow-y:auto;
transition:.35s;
box-shadow:-5px 0 20px rgba(0,0,0,.08);
z-index:9998;
}

.mobile-menu.active{
right:0;
}

.mobile-menu ul{
list-style:none;
}

.mobile-menu li{
margin-bottom:10px;
}

.mobile-menu a{
display:flex;
justify-content:space-between;
align-items:center;
padding:13px 15px;
text-decoration:none;
border-radius:12px;
font-weight:500;
color:#444;
transition:.3s;
}

.mobile-menu a:hover{
background:var(--primary);
color:#fff;
}

.mobile-submenu{
display:none;
padding-left:18px;
margin-top:8px;
}

.mobile-submenu a{
background:#F8FAFC;
font-size:14px;
border-left:4px solid var(--primary);
margin-bottom:6px;
}

/* ===================================
MAIN
=================================== */

.main{
max-width:1400px;
margin:100px auto 50px;
padding:35px;
position:relative;
z-index:2;
}

/* ===================================
HIASAN DAUN
=================================== */

.leaf{
position:fixed;
width:170px;
height:170px;
opacity:.07;
pointer-events:none;
background:url("images/leaf.png") center/contain no-repeat;
z-index:-1;
}

.leaf.left{
top:180px;
left:-40px;
}

.leaf.right{
bottom:100px;
right:-40px;
transform:rotate(180deg);
}

/* ===================================
HERO
=================================== */

.hero{
position:relative;
overflow:hidden;
border-radius:24px;
box-shadow:var(--shadow);
margin-bottom:45px;
}

.hero img{
width:100%;
height:360px;
object-fit:cover;
display:block;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.35);
}

.hero-content{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
color:white;
width:90%;
z-index:2;
}

.hero-content img{
width:80px;
height:80px;
object-fit:contain;
margin-bottom:18px;
}

.hero-content h1{
font-size:48px;
font-weight:700;
margin-bottom:14px;
text-shadow:0 3px 10px rgba(0,0,0,.25);
}

.hero-content p{
font-size:19px;
}

/* ===================================
SECTION
=================================== */

.section{
background:white;
padding:35px;
border-radius:22px;
box-shadow:var(--shadow);
margin-bottom:35px;
}

.section-title{
text-align:center;
margin-bottom:30px;
}

.section-title h2{
font-size:34px;
color:var(--primary);
margin-bottom:12px;
}

.line{
width:90px;
height:4px;
background:var(--primary);
margin:auto;
border-radius:50px;
}

.section p{
font-size:16px;
line-height:2;
text-align:justify;
color:#555;
}

</style>

</head>
